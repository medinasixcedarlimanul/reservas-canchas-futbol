services:
  db:
    image: mysql:8.0
    container_name: reservas-canchas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reservas_db}
      MYSQL_USER: ${MYSQL_USER:-reservas_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_app_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservas_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reservas-canchas-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-reservas_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dev_app_password}
      DB_NAME: ${MYSQL_DATABASE:-reservas_db}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_reservas_multinegocio_2026_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-}
      APP_URL: ${APP_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM: ${EMAIL_FROM:-reservas@sportreserve.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SportReserve Platform}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-mock}
      FLOW_API_KEY: ${FLOW_API_KEY:-}
      FLOW_SECRET_KEY: ${FLOW_SECRET_KEY:-}
      FLOW_ENV: ${FLOW_ENV:-sandbox}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservas_network

volumes:
  mysql_data:
    driver: local

networks:
  reservas_network:
    driver: bridge
