<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — SportReserve</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="justify-content: center; align-items: center;">
  <div style="width: 100%; max-width: 480px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/index.html" class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
        ⚡ SportReserve
      </a>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Crea tu cuenta global para reservar en todos los centros deportivos</p>
    </div>

    <div class="card">
      <div id="alert-box" style="display: none;"></div>

      <form id="registro-form">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre Completo *</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej. Carlos Martínez" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico *</label>
          <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required autocomplete="username">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="telefono">Teléfono / Celular</label>
            <input type="tel" id="telefono" class="form-control" placeholder="999000000">
          </div>
          <div class="form-group">
            <label class="form-label" for="dni">DNI / Documento</label>
            <input type="text" id="dni" class="form-control" placeholder="8 dígitos">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña *</label>
          <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Crear Cuenta
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
        <span style="color: var(--text-muted);">¿Ya tienes una cuenta registrada?</span>
        <a href="/login.html" style="color: var(--primary); font-weight: 600; margin-left: 0.25rem;">Inicia sesión</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registro-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        const nombre = document.getElementById('nombre').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const telefono = document.getElementById('telefono').value.trim();
        const dni = document.getElementById('dni').value.trim();

        if (password.length < 6) {
          mostrarAlerta('La contraseña debe tener al menos 6 caracteres.', 'danger');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Registrando...';

        try {
          await auth.register({ nombre, email, password, telefono, dni });
          mostrarAlerta('¡Cuenta creada con éxito! Iniciando sesión...', 'success');
          
          // Auto login
          await auth.login(email, password);
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1200);
        } catch (err) {
          mostrarAlerta(err.message, 'danger');
          btn.disabled = false;
          btn.textContent = 'Crear Cuenta';
        }
      });

      function mostrarAlerta(msg, tipo = 'danger') {
        const box = document.getElementById('alert-box');
        box.className = `alert alert-${tipo}`;
        box.textContent = msg;
        box.style.display = 'block';
      }
    });
  </script>
</body>
</html>
